<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yapifier</title>
    <meta name="description" content="See it, point at it, say the change with Wispr Flow, and your video edits itself." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#ffffeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#012b26" media="(prefers-color-scheme: dark)" />
    <script>
      // Pick the theme before first paint (src/theme.ts takes over after load).
      var saved = null;
      try { saved = localStorage.getItem("yapifier-theme"); } catch (e) {}
      document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
