  <script>
    (function () {
      // Letters of the title, and the voice-wave bars either side of the key (deterministic).
      const title = document.querySelector("#reveal-title");
      const word = title.textContent;
      title.textContent = "";
      for (const c of word) {
        const s = document.createElement("span");
        s.className = "ltr";
        s.textContent = c === " " ? " " : c;
        title.appendChild(s);
      }
      const barsHost = document.querySelector("#reveal-bars");
      const bars = [];
      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 8; i++) {
          const b = document.createElement("div");
          b.className = "reveal-bar";
          b.style.left = 960 + side * (215 + i * 40) - 12 + "px";
          barsHost.appendChild(b);
          bars.push({ el: b, i });
        }
      }

      const tl = gsap.timeline({ paused: true });
      // 0–0.7 s: Fn travels to the centre and grows into the hero.
      tl.fromTo("#reveal-fn", { x: 0, y: 0, scale: 1 }, { x: 640, y: -395, scale: 3.2, duration: 0.7, ease: "expo.out" }, 0.05);
      // 1.1 s: it is pressed and held.
      tl.fromTo("#reveal-fn-cap", { y: 0, boxShadow: "0 10px 0 #5a3ed6, 0 18px 30px rgba(20,16,31,0.22)" }, { y: 8, boxShadow: "0 2px 0 #5a3ed6, 0 6px 12px rgba(20,16,31,0.2)", duration: 0.08, ease: "power2.out" }, 1.1);
      // The voice comes out of it: bars rise outward, then talk.
      bars.forEach(({ el, i }, n) => {
        const at = 1.15 + i * 0.035;
        tl.fromTo(el, { scaleY: 0.02, opacity: 0 }, { scaleY: 0.25 + 0.75 * Math.abs(Math.sin((i + 1) * 1.7)), opacity: 1, duration: 0.35, ease: "expo.out" }, at);
        for (let k = 1; k <= 6; k++) {
          const h = 0.18 + 0.82 * Math.abs(Math.sin((i + 1) * 1.3 + k * 2.1 + n * 0.37));
          tl.to(el, { scaleY: h, duration: 0.22, ease: "power2.inOut" }, at + 0.3 + k * 0.24);
        }
      });
      // 1.9 s: key and wave lift; the name lands under them.
      tl.to("#reveal-group", { y: -150, scale: 0.62, transformOrigin: "960px 420px", duration: 0.6, ease: "power3.inOut" }, 1.6);
      tl.fromTo("#reveal-title .ltr", { opacity: 0.25, filter: "blur(6px)", y: 30 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.35, ease: "expo.out", stagger: 0.06 }, 1.75);

      window.__timelines["reveal"] = tl;
    })();
