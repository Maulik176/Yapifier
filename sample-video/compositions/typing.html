  <div data-hf-id="hf-ztns" id="root" data-composition-id="typing" data-width="1920" data-height="1080">
    <div data-hf-id="hf-rss3" id="typing-cursor" class="clip" data-start="0" data-duration="2.25"></div>

  <script>
    (function () {
      // Split the prompt into per-character spans once, deterministically.
      const prompt = document.querySelector("#typing-prompt");
      const text = prompt.textContent;
      prompt.textContent = "";
      for (const c of text) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c;
        prompt.appendChild(s);
      }
      const chars = prompt.querySelectorAll(".ch");
      const keys = document.querySelectorAll(".typing-letter");
      const tl = gsap.timeline({ paused: true });

      // 0–2.25 s: a lone cursor blinks twice (the planted slow start).
      tl.set("#typing-cursor", { opacity: 1 }, 0)
        .set("#typing-cursor", { opacity: 0 }, 0.55)
        .set("#typing-cursor", { opacity: 1 }, 1.1)
        .set("#typing-cursor", { opacity: 0 }, 1.65)
        .set("#typing-cursor", { opacity: 1 }, 2.0);

      // Keys arrive as one row.
      tl.fromTo("#typing-row .key", { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out", stagger: 0.025 }, 1.6);

      // 2.4–6.2 s: typing, one character at a time, each pressing a key.
      const t0 = 2.4;
      const step = 3.7 / chars.length;
      chars.forEach((ch, i) => {
        const at = t0 + i * step;
        tl.set(ch, { opacity: 1 }, at);
        if (ch.textContent.trim()) {
          const k = keys[(ch.textContent.toLowerCase().charCodeAt(0) * 7) % keys.length];
          tl.fromTo(k, { y: 0 }, { y: 9, duration: 0.05, ease: "power2.out" }, at).to(k, { y: 0, duration: 0.12, ease: "power2.out" }, at + 0.05);
        }
      });

      // 6.4–8.4 s: it piles up into a wall.
      ["#typing-wall1", "#typing-wall2", "#typing-wall3"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 6.45 + i * 0.32);
      });
      tl.to(["#typing-prompt", ".typing-wall"], { color: "#6b5a1a", duration: 0.5, ease: "power2.inOut" }, 7.5);

      // 8.6–9.1 s: the words and every letter key drop away; Fn stays where it is.
      tl.to(["#typing-prompt", ".typing-wall"], { y: 700, opacity: 0, duration: 0.45, ease: "power3.in", stagger: 0.05 }, 8.6);
      tl.to(".typing-letter", { y: 520, rotation: (i) => (i % 2 ? 14 : -11), duration: 0.5, ease: "power3.in", stagger: 0.02 }, 8.62);

      window.__timelines["typing"] = tl;
    })();
  </script>
